name: Build Windows exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<rust/Cargo.toml version>) with the player and dev exes
        type: boolean
        default: false

permissions:
  contents: write

# The repository name ends with a period, and Windows can't create a folder with that name,
# so actions/checkout can't use the default workspace. Clone into C:\emberwild instead.
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: C:\
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}" C:\emberwild
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal; rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            C:\emberwild\rust\target
          key: rust-win-${{ github.sha }}
          restore-keys: rust-win-
      - name: Build and package
        id: pkg
        working-directory: C:\emberwild\rust
        # the player build, then the dev build (balance bot and test hooks); the dependencies are shared
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target\release\emberwild.exe "dist\Emberwild-$v.exe"
          cargo build --release --features dev
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target\release\emberwild.exe "dist\Emberwild-$v-dev.exe"
          echo "v=v$v" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Emberwild-windows
          path: C:\emberwild\rust\dist\*.exe
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:\emberwild\rust\dist\*.exe
      # A manual run with "release" ticked tags this commit v<version> and publishes the exe,
      # for when pushing a tag isn't possible.
      - name: Publish release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Emberwild ${{ steps.pkg.outputs.v }}
          body_path: C:\emberwild\RELEASE_NOTES.md
          files: C:\emberwild\rust\dist\*.exe
          make_latest: true
