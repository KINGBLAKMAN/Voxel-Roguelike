name: Build Windows exe

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<package.json version>) with the exes
        type: boolean
        default: false

permissions:
  contents: write

# The repository name ends with a period, and Windows can't create a folder with that name,
# so actions/checkout can't use the default workspace. Clone into C:\emberwild instead.
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: C:\
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}" C:\emberwild
      - name: Install
        working-directory: C:\emberwild
        run: npm ci
      - name: Build exe
        working-directory: C:\emberwild
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Emberwild-windows
          path: C:\emberwild\dist\*.exe
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: C:\emberwild\dist\*.exe
      # A manual run with "release" ticked tags this commit v<version> and publishes the exes,
      # for when pushing a tag isn't possible.
      - name: Read version
        id: ver
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: C:\emberwild
        run: echo "v=v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Publish release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Emberwild ${{ steps.ver.outputs.v }}
          body_path: C:\emberwild\RELEASE_NOTES.md
          files: C:\emberwild\dist\*.exe
